<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem Estar e Saúde — Meu painel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variaveis.css">
<link rel="stylesheet" href="../css/estilo.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-marca"><span>🩺</span> Bem Estar e Saúde</div>
    <div class="cabecalho-usuario">
      <span class="cabecalho-nome" id="nomePacienteCabecalho"></span>
      <div id="avatarCabecalho"></div>
      <div class="cabecalho-navegacao">
        <a href="perfil.html" class="botao botao--secundario botao--pequeno">Perfil</a>
        <button type="button" id="botaoSair" class="botao botao--perigo botao--pequeno">Sair</button>
      </div>
    </div>
  </header>

  <main class="conteudo-pagina">
    <section class="secao cartao">
      <div class="cabecalho-perfil-resumo">
        <div id="avatarResumoPaciente"></div>
        <div>
          <h2 id="nomeResumoPaciente"></h2>
          <p id="detalhesResumoPaciente"></p>
        </div>
      </div>
      <div class="grade-sinais-vitais" id="gradeSinaisVitaisPaciente"></div>
      <div class="linha-formulario">
        <div>
          <div class="subtitulo-bloco-info">Alergia medicamentosa</div>
          <div class="bloco-texto-livre" id="alergiaPaciente"></div>
        </div>
        <div>
          <div class="subtitulo-bloco-info">Histórico familiar</div>
          <div class="bloco-texto-livre" id="historicoPaciente"></div>
        </div>
      </div>
    </section>

    <div class="grade-duas-colunas">
      <section class="secao">
        <div class="secao-titulo"><h2>Vacinas administradas</h2></div>
        <div class="lista-itens" id="listaVacinasPaciente"></div>
      </section>

      <section class="secao">
        <div class="secao-titulo"><h2>Medicamentos</h2></div>
        <div class="lista-itens" id="listaMedicamentosPaciente"></div>
      </section>
    </div>
  </main>

<script src="../js/utilitarios.js"></script>
<script src="../js/armazenamento.js"></script>
<script src="../js/autenticacao.js"></script>
<script src="../js/alarmes.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
