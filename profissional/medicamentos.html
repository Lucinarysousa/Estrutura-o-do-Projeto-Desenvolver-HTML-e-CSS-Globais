<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem Estar e Saúde — Medicamentos do paciente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variaveis.css">
<link rel="stylesheet" href="../css/estilo.css">
<link rel="stylesheet" href="paciente-detalhe.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-marca"><span>🩺</span> Bem Estar e Saúde</div>
    <div class="cabecalho-usuario">
      <div class="cabecalho-navegacao">
        <a href="dashboard.html" class="botao botao--secundario botao--pequeno">Voltar ao painel</a>
        <button type="button" id="botaoSair" class="botao botao--perigo botao--pequeno">Sair</button>
      </div>
    </div>
  </header>

  <main class="conteudo-pagina">
    <div class="cabecalho-pagina-paciente">
      <div id="avatarCabecalhoPaciente"></div>
      <div>
        <h1 id="nomePacienteMedicamentos"></h1>
        <p>Controle de medicamentos e horários de administração</p>
      </div>
    </div>

    <div class="secao-titulo">
      <h2>Medicamentos cadastrados</h2>
      <button type="button" class="botao botao--primario" id="botaoNovoMedicamento">+ Novo medicamento</button>
    </div>
    <div class="lista-itens" id="listaMedicamentos"></div>
  </main>

  <div id="modalMedicamento" class="sobreposicao-modal oculto">
    <div class="caixa-modal">
      <div class="cabecalho-modal">
        <h2 id="tituloModalMedicamento">Novo medicamento</h2>
        <button type="button" class="botao-fechar-modal" id="fecharModalMedicamento">&times;</button>
      </div>
      <form id="formularioMedicamento">
        <input type="hidden" id="medicamentoIdFormulario">
        <div class="linha-formulario">
          <div class="grupo-formulario">
            <label for="medicamentoNome">Nome do medicamento</label>
            <input class="campo-texto" type="text" id="medicamentoNome" required>
          </div>
          <div class="grupo-formulario">
            <label for="medicamentoVia">Via de administração</label>
            <select class="campo-selecao" id="medicamentoVia" required>
              <option value="oral">Oral</option>
              <option value="intravenosa">Intravenosa</option>
            </select>
          </div>
        </div>
        <div class="linha-formulario">
          <div class="grupo-formulario">
            <label for="medicamentoDosagem">Dosagem</label>
            <input class="campo-texto" type="text" id="medicamentoDosagem" placeholder="Ex: 1 comprimido" required>
          </div>
          <div class="grupo-formulario">
            <label for="medicamentoFrequencia">Frequência</label>
            <input class="campo-texto" type="text" id="medicamentoFrequencia" placeholder="Ex: 8/8 horas">
          </div>
        </div>
        <div class="linha-formulario">
          <div class="grupo-formulario">
            <label for="medicamentoHorario">Horário do alarme</label>
            <input class="campo-texto" type="time" id="medicamentoHorario" required>
          </div>
          <div class="grupo-formulario">
            <label for="medicamentoDataInicio">Data de início</label>
            <input class="campo-texto" type="date" id="medicamentoDataInicio" required>
          </div>
          <div class="grupo-formulario">
            <label for="medicamentoDataFim">Data final <span class="texto-ajuda">(opcional)</span></label>
            <input class="campo-texto" type="date" id="medicamentoDataFim">
          </div>
        </div>
        <p class="texto-ajuda">O alarme tocará diariamente no horário informado até a confirmação da administração (horário de Brasília).</p>
        <div class="rodape-formulario">
          <button type="button" class="botao botao--secundario" id="botaoCancelarMedicamento">Cancelar</button>
          <button type="submit" class="botao botao--primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

<script src="../js/utilitarios.js"></script>
<script src="../js/armazenamento.js"></script>
<script src="../js/autenticacao.js"></script>
<script src="../js/alarmes.js"></script>
<script src="medicamentos.js"></script>
</body>
</html>
