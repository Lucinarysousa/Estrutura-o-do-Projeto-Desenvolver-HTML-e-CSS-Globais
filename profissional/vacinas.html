<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem Estar e Saúde — Vacinas do paciente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variaveis.css">
<link rel="stylesheet" href="../css/estilo.css">
<link rel="stylesheet" href="paciente-detalhe.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-marca"><span>🩺</span> Bem Estar e Saúde</div>
    <div class="cabecalho-usuario">
      <div class="cabecalho-navegacao">
        <a href="dashboard.html" class="botao botao--secundario botao--pequeno">Voltar ao painel</a>
        <button type="button" id="botaoSair" class="botao botao--perigo botao--pequeno">Sair</button>
      </div>
    </div>
  </header>

  <main class="conteudo-pagina">
    <div class="cabecalho-pagina-paciente">
      <div id="avatarCabecalhoPaciente"></div>
      <div>
        <h1 id="nomePacienteVacinas"></h1>
        <p>Controle de vacinas e reforços</p>
      </div>
    </div>

    <div class="secao-titulo">
      <h2>Vacinas registradas</h2>
      <button type="button" class="botao botao--primario" id="botaoNovaVacina">+ Nova vacina</button>
    </div>
    <div id="listaVacinas"></div>
  </main>

  <div id="modalVacina" class="sobreposicao-modal oculto">
    <div class="caixa-modal">
      <div class="cabecalho-modal">
        <h2 id="tituloModalVacina">Nova vacina</h2>
        <button type="button" class="botao-fechar-modal" id="fecharModalVacina">&times;</button>
      </div>
      <form id="formularioVacina">
        <input type="hidden" id="vacinaIdFormulario">
        <div class="grupo-formulario">
          <label for="vacinaNome">Nome da vacina</label>
          <input class="campo-texto" type="text" id="vacinaNome" required>
        </div>
        <div class="linha-formulario">
          <div class="grupo-formulario">
            <label for="vacinaDataAplicacao">Data de aplicação</label>
            <input class="campo-texto" type="date" id="vacinaDataAplicacao" required>
          </div>
          <div class="grupo-formulario">
            <label for="vacinaDose">Dose</label>
            <input class="campo-texto" type="text" id="vacinaDose" placeholder="Ex: 1ª dose">
          </div>
        </div>
        <div class="grupo-formulario">
          <label for="vacinaObservacoes">Observações</label>
          <textarea class="campo-area" id="vacinaObservacoes"></textarea>
        </div>
        <div class="rodape-formulario">
          <button type="button" class="botao botao--secundario" id="botaoCancelarVacina">Cancelar</button>
          <button type="submit" class="botao botao--primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modalReforco" class="sobreposicao-modal oculto">
    <div class="caixa-modal caixa-modal--estreita">
      <div class="cabecalho-modal">
        <h2>Registrar reforço</h2>
        <button type="button" class="botao-fechar-modal" id="fecharModalReforco">&times;</button>
      </div>
      <form id="formularioReforco">
        <input type="hidden" id="reforcoVacinaIdFormulario">
        <input type="hidden" id="reforcoIdFormulario">
        <div class="linha-formulario">
          <div class="grupo-formulario">
            <label for="reforcoData">Data</label>
            <input class="campo-texto" type="date" id="reforcoData" required>
          </div>
          <div class="grupo-formulario">
            <label for="reforcoHorario">Horário</label>
            <input class="campo-texto" type="time" id="reforcoHorario" required>
          </div>
        </div>
        <p class="texto-ajuda">O alarme tocará automaticamente na data e horário informados (horário de Brasília).</p>
        <div class="rodape-formulario">
          <button type="button" class="botao botao--secundario" id="botaoCancelarReforco">Cancelar</button>
          <button type="submit" class="botao botao--primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

<script src="../js/utilitarios.js"></script>
<script src="../js/armazenamento.js"></script>
<script src="../js/autenticacao.js"></script>
<script src="../js/alarmes.js"></script>
<script src="vacinas.js"></script>
</body>
</html>
