<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem Estar e Saúde — Meu perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/variaveis.css">
<link rel="stylesheet" href="../css/estilo.css">
<link rel="stylesheet" href="perfil.css">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-marca"><span>🩺</span> Bem Estar e Saúde</div>
    <div class="cabecalho-usuario">
      <div class="cabecalho-navegacao">
        <a href="dashboard.html" class="botao botao--secundario botao--pequeno">Voltar ao painel</a>
        <button type="button" id="botaoSair" class="botao botao--perigo botao--pequeno">Sair</button>
      </div>
    </div>
  </header>

  <main class="conteudo-pagina">
    <div class="envelope-perfil">
      <div class="cartao">
        <div class="secao-titulo"><h2>Meus dados</h2></div>
        <form id="formularioPerfil">
          <div class="rotulo-preview-foto grupo-formulario">
            <div id="previaFotoPerfil" class="avatar-iniciais avatar-grande">?</div>
            <div>
              <button type="button" id="botaoEscolherFotoPerfil" class="botao botao--secundario botao--pequeno">Alterar foto</button>
              <input type="file" id="entradaFotoPerfil" class="entrada-arquivo-oculta" accept="image/*">
            </div>
          </div>
          <div class="linha-formulario">
            <div class="grupo-formulario">
              <label for="perfilNome">Nome completo</label>
              <input class="campo-texto" type="text" id="perfilNome" required>
            </div>
            <div class="grupo-formulario">
              <label for="perfilCpf">CPF</label>
              <input class="campo-texto" type="text" id="perfilCpf" disabled>
            </div>
          </div>
          <div class="linha-formulario">
            <div class="grupo-formulario">
              <label for="perfilEmail">Email</label>
              <input class="campo-texto" type="email" id="perfilEmail" required>
              <span class="texto-erro-campo" id="erroPerfilEmail"></span>
            </div>
            <div class="grupo-formulario">
              <label for="perfilNascimento">Data de nascimento</label>
              <input class="campo-texto" type="date" id="perfilNascimento" required>
            </div>
          </div>
          <div class="grupo-formulario">
            <label for="perfilCoren">Número do COREN</label>
            <input class="campo-texto" type="text" id="perfilCoren" required>
          </div>
          <div class="linha-formulario">
            <div class="grupo-formulario">
              <label for="perfilNovaSenha">Nova senha <span class="texto-ajuda">(deixe em branco para manter)</span></label>
              <input class="campo-texto" type="password" id="perfilNovaSenha" minlength="6">
            </div>
            <div class="grupo-formulario">
              <label for="perfilConfirmarSenha">Repetir nova senha</label>
              <input class="campo-texto" type="password" id="perfilConfirmarSenha" minlength="6">
              <span class="texto-erro-campo" id="erroPerfilSenha"></span>
            </div>
          </div>
          <div class="rodape-formulario">
            <button type="submit" class="botao botao--primario">Salvar alterações</button>
          </div>
        </form>
      </div>

      <div class="cartao cartao-zona-perigo">
        <h3>Excluir conta</h3>
        <p>Esta ação é permanente e também apagará todos os pacientes cadastrados por você, junto de suas vacinas, medicamentos e anamneses.</p>
        <button type="button" id="botaoExcluirConta" class="botao botao--perigo">Excluir minha conta</button>
      </div>
    </div>
  </main>

<script src="../js/utilitarios.js"></script>
<script src="../js/armazenamento.js"></script>
<script src="../js/autenticacao.js"></script>
<script src="../js/alarmes.js"></script>
<script src="perfil.js"></script>
</body>
</html>
